<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sistema Escolar{% endblock %}</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#20283a}
    header{background:#25345c;color:white;padding:22px 8%}nav a{color:white;margin-right:20px;text-decoration:none}
    main{max-width:1000px;margin:35px auto;padding:0 20px}.card{background:white;padding:24px;border-radius:12px;margin:15px 0;box-shadow:0 3px 14px #18264a12}
    h1{margin-top:0}a{color:#3156a3}.muted{color:#667085}
  </style>
</head>
<body>
<header><strong>Sistema Escolar</strong><nav style="margin-top:14px">
<a href="{% url 'inicio' %}">Início</a><a href="{% url 'alunos' %}">Alunos</a><a href="{% url 'cursos' %}">Cursos</a><a href="/admin/">Administração</a>
</nav></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
